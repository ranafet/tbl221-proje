[project]
name = "tbl221-record"
version = "1.0.0"
description = "Linux system resource monitor and SQLite recorder"
authors = [
    {name = "Yiğit Cemal Öztürk", email = "251307091@kocaeli.edu.tr"}
]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tbl221-record = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "db*", "model*", "util*"]
namespaces = true
