[project]
name = "tbl221-graphui"
version = "1.0.0"
description = "TBL221 Linux system resource monitoring dashboard"
authors = [
    {name = "Yiğit Cemal Öztürk", email = "251307091@kocaeli.edu.tr"}
]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11,<3.16"
dependencies = ["PySide6>=6.8,<7.0"]

[project.scripts]
tbl221-graphui = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
